<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MINTOBABY — Brand & Web3 Studio</title>
    <!-- Google Fonts: Space Grotesk & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --background: 250 14% 6%;           /* near-black deep #0a0a0f */
        --foreground: 0 0% 96%;             /* white */
        --primary: 256 72% 58%;             /* electric violet #6b3ce8 */
        --primary-foreground: 0 0% 96%;
        --accent: 256 72% 58%;
        --surface: 250 12% 10%;             /* #14131a */
        --surface-raised: 250 10% 14%;      /* #1c1b24 */
        --muted-foreground: 250 8% 54%;     /* #827e99 */
        --border: 250 8% 20%;               /* #2e2b3b */
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background-color: #0a0a0f;
        color: #f5f5f5;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .font-heading {
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0f;
      }
      ::-webkit-scrollbar-thumb {
        background: #1c1b24;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b3ce8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
