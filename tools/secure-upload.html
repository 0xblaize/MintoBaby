<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>mintobaby — Secure Seed Upload</title>
</head>
<body>
  <h2>Secure Seed / Private Key Upload (Client‑side encrypted)</h2>
  <p>Do NOT paste secrets into Telegram. This page encrypts your seed locally and sends ciphertext to the server for ephemeral use.</p>

  <label for="seed">Seed phrase / private key</label><br/>
  <textarea id="seed" rows="4" cols="60"></textarea><br/>
  <label for="name">Your name (optional)</label><br/>
  <input id="name" type="text"/><br/>
  <button id="send">Encrypt & Upload</button>
  <p id="status"></p>

  <script>
    // Server must expose its RSA public key (PEM) at /seed-public-key
    async function fetchPublicKey() {
      const r = await fetch('/seed-public-key');
      if(!r.ok) throw new Error('failed to fetch public key');
      return r.text();
    }

    function pemToArrayBuffer(pem) {
      const b64 = pem.replace(/-----.*-----/g,'').replace(/\s+/g,'');
      const binary = atob(b64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i=0;i<len;i++) bytes[i]=binary.charCodeAt(i);
      return bytes.buffer;
    }

    async function importRsaKey(pem) {
      const ab = pemToArrayBuffer(pem);
      return crypto.subtle.importKey('spki', ab, {name:'RSA-OAEP', hash:'SHA-256'}, false, ['encrypt']);
    }

    async function encryptWithPublicKey(key, plaintext) {
      const enc = new TextEncoder().encode(plaintext);
      const ct = await crypto.subtle.encrypt({name:'RSA-OAEP'}, key, enc);
      return btoa(String.fromCharCode(...new Uint8Array(ct)));
    }

    document.getElementById('send').addEventListener('click', async ()=>{
      const seed = document.getElementById('seed').value.trim();
      const name = document.getElementById('name').value.trim() || 'anonymous';
      if(!seed){ alert('enter seed'); return; }
      document.getElementById('status').textContent = 'Fetching public key...';
      try{
        const pem = await fetchPublicKey();
        const rsaPub = await importRsaKey(pem);
        document.getElementById('status').textContent = 'Encrypting...';
        const ciphertext = await encryptWithPublicKey(rsaPub, seed);
        document.getElementById('status').textContent = 'Uploading ciphertext...';
        const res = await fetch('/seed-upload', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ciphertext, name})
        });
        const j = await res.json();
        if(!res.ok) throw new Error(j.error || 'upload failed');
        document.getElementById('status').textContent = 'Uploaded. Server processed request id: '+j.id;
        document.getElementById('seed').value='';
      }catch(e){ document.getElementById('status').textContent = 'Error: '+e.message }
    });
  </script>
</body>
</html>
